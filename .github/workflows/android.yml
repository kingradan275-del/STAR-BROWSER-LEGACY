
name: STAR BROWSER LEGACY - Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build STAR BROWSER LEGACY APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/tools/bin" >> $GITHUB_PATH

      - name: Locate Android SDK Manager
        run: |
          echo "Searching for sdkmanager..."
          find /usr/local/lib/android/sdk -name sdkmanager -type f
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5"

      - name: Verify environment
        run: |
          java -version
          gradle --version
          "$SDKMANAGER" --version

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-BROWSER-LEGACY-1.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
